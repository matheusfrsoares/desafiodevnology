# =============================================================================
# GitLab CI/CD Pipeline — Trainee DevOps API
# Stages: lint → test → build → security → deploy
# =============================================================================

# Imagem padrão para os jobs que não especificam outra
image: python:3.12-alpine

# Definição das stages em ordem de execução
stages:
  - lint
  - test
  - build
  - security
  - deploy

# =============================================================================
# Variáveis globais
# CI_REGISTRY, CI_REGISTRY_IMAGE, CI_COMMIT_SHA e CI_COMMIT_REF_NAME
# são injetadas automaticamente pelo GitLab CI
# =============================================================================
variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Cache das dependências Python para acelerar os builds
cache:
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip
    - venv/

# =============================================================================
# STAGE: lint
# Verifica a qualidade e estilo do código com flake8
# O job falha automaticamente se houver erros de lint
# =============================================================================
lint:
  stage: lint
  before_script:
    - pip install flake8 --quiet
  script:
    - echo "🔍 Rodando linter (flake8)..."
    - flake8 app.py test_app.py --max-line-length=88 --statistics
    - echo "✅ Lint passou sem erros!"

# =============================================================================
# STAGE: test
# Roda os testes unitários com pytest
# O job falha se qualquer teste falhar
# =============================================================================
test:
  stage: test
  before_script:
    - pip install -r requirements.txt --quiet
  script:
    - echo "🧪 Rodando testes unitários (pytest)..."
    - pytest test_app.py -v --tb=short
    - echo "✅ Todos os testes passaram!"
  artifacts:
    reports:
      junit: report.xml
    expire_in: 1 week
    when: always

# =============================================================================
# STAGE: build
# Builda a imagem Docker e faz push para o GitLab Container Registry
# Usa as variáveis de CI para nomear a imagem com a SHA do commit
# =============================================================================
build:
  stage: build
  image: docker:24-alpine
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "🔐 Autenticando no GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "🐳 Construindo imagem Docker..."
    - docker build --pull
        --cache-from $IMAGE_LATEST
        --label "git-commit=$CI_COMMIT_SHA"
        --label "git-branch=$CI_COMMIT_REF_NAME"
        --label "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        -t $IMAGE_TAG
        -t $IMAGE_LATEST
        .
    - echo "📤 Fazendo push para o registry..."
    - docker push $IMAGE_TAG
    - docker push $IMAGE_LATEST
    - echo "✅ Imagem publicada com sucesso! Tag: $CI_COMMIT_SHORT_SHA"

# =============================================================================
# STAGE: security (BÔNUS)
# SAST — Static Application Security Testing com Bandit
# Analisa o código Python em busca de vulnerabilidades conhecidas
# =============================================================================
security:
  stage: security
  before_script:
    - pip install bandit --quiet
  script:
    - echo "🔒 Rodando análise de segurança (Bandit SAST)..."
    - bandit -r app.py -f txt -ll
    - echo "✅ Análise de segurança concluída!"
  allow_failure: true  # Não bloqueia o deploy, mas exibe o relatório
  artifacts:
    reports:
      sast: gl-sast-report.json
    expire_in: 1 week
    when: always

# =============================================================================
# STAGE: deploy
# Simula o deploy no AWS ECS imprimindo os comandos que seriam executados.
# Este job roda APENAS na branch main (proteção de ambiente de produção).
# =============================================================================
deploy:
  stage: deploy
  image: python:3.12-alpine
  environment:
    name: production
    url: http://minha-app.exemplo.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'  # Só executa na branch main
  before_script:
    - apk add --no-cache curl --quiet
  script:
    - echo "🚀 Iniciando deploy no AWS ECS..."
    - echo ""
    - echo "=========================================="
    - echo "Comandos que seriam executados em produção"
    - echo "=========================================="
    - echo ""
    - echo "1. Atualizar task definition do ECS com a nova imagem:"
    - echo "   aws ecs register-task-definition \\"
    - echo "     --family trainee-api \\"
    - echo "     --container-definitions '[{"
    - echo "       \"name\": \"trainee-api\","
    - echo "       \"image\": \"$IMAGE_TAG\","
    - echo "       \"portMappings\": [{\"containerPort\": 5000}]"
    - echo "     }]'"
    - echo ""
    - echo "2. Atualizar o serviço ECS com a nova task definition:"
    - echo "   aws ecs update-service \\"
    - echo "     --cluster trainee-cluster \\"
    - echo "     --service trainee-api-service \\"
    - echo "     --task-definition trainee-api \\"
    - echo "     --force-new-deployment"
    - echo ""
    - echo "3. Aguardar a estabilização do serviço:"
    - echo "   aws ecs wait services-stable \\"
    - echo "     --cluster trainee-cluster \\"
    - echo "     --services trainee-api-service"
    - echo ""
    - echo "4. Verificar saúde da aplicação:"
    - echo "   curl -f http://minha-app.exemplo.com/health"
    - echo ""
    - echo "✅ Deploy simulado com sucesso!"
    - echo "   Imagem deployada: $IMAGE_TAG"
    - echo "   Branch: $CI_COMMIT_BRANCH"
    - echo "   Commit: $CI_COMMIT_SHA"
    - echo "   Autor: $GITLAB_USER_NAME"
    - echo "   Data: $(date -u)"
